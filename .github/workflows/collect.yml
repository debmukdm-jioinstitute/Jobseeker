name: collect
on:
  push:
    paths: ["data/inbox/**", "jobseeker-*.json", "data/jobseeker-*.json"] # agent delivered a file: merge right away
  schedule:
    - cron: "0 */6 * * *" # backup sweep + 30-day cleanup
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/collect.ts
      - run: npm ci
      - run: node scripts/contacts.ts # Database: keep the people behind every post, in private Vercel Blob
        continue-on-error: true # a missing token must never stop the job feed from updating
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "jobseeker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "data: merge agent feeds" && git pull --rebase -q && git push)
