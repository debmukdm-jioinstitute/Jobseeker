name: collect
on:
  push:
    paths: ["data/inbox/**"] # agent uploaded a file: merge right away
  schedule:
    - cron: "0 */6 * * *" # backup sweep + 30-day cleanup
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/collect.ts
      - name: Commit if changed
        run: |
          git config user.name "jobseeker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "data: merge agent feeds" && git pull --rebase -q && git push)
